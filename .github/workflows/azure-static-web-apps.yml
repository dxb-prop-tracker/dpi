# Builds the site on a schedule (daily) and on push, then deploys to Azure Static Web Apps.
# Secret required in the GitHub repo:
#   AZURE_STATIC_WEB_APPS_API_TOKEN  – from the SWA resource in the Azure portal (Overview -> Manage deployment token)
# Data: the starter seeds sample data. Replace the "Seed sample data" step with a step that downloads
# your DLD CSVs (Dubai Pulse API) and listing scans into data/, then runs `npm run pipeline`.
name: build-and-deploy
on:
  push: { branches: [main] }
  schedule: [{ cron: '30 2 * * *' }]   # 06:30 Dubai, after Dubai Pulse's overnight sync
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Seed sample data (replace with real ingestion)
        run: npm run seed
      - run: npm run build
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
